# Personal motor insurance preset.
# The third-party (liability) section is calibrated so its development
# triangles fall within the P5-P95 bands observed across the curated
# Schedule P private passenger auto reference data
# (data/reference/schedule p/ppauto_pos98-07, 96 hand-curated companies).
# That reference is a liability line with no physical damage in it, so the
# realism gate scores third-party claims against their share of premium and
# leaves own damage out; own-damage settlement is set as a short-tail class
# instead of being bent to liability speed.
name: motor-personal
book:
  growth_factor: 1.03
  size_volatility: 0.06
  spread: 0.4
  sum_insured_median: 20000
  sum_insured_inflation: 1.03
  excess_choices:
    - {value: 0, weight: 0.10}
    - {value: 100, weight: 0.20}
    - {value: 300, weight: 0.30}
    - {value: 500, weight: 0.30}
    - {value: 1000, weight: 0.10}
# Pricing basis: the insurer's assumed loss cost, used only to set premium.
# Independent of the claims block, which generates the true experience:
# target_loss_ratio sets premium, and the realized loss ratio is emergent.
# These assumptions start from the claims values (as below), so the loss
# ratio lands around target_loss_ratio, moved by claim sampling and the
# simulated inflation path; deviate them to model underpricing or adverse
# experience. Each policy's assumed cost is trended at inflation_mean to the
# middle of its cover.
pricing:
  target_loss_ratio: 0.72
  # Each underwriting year's rates miss the target by mean-one lognormal
  # noise of this sigma, as in an underwriting cycle, so cohort loss ratios
  # scatter around the target. 0 switches it off. 0.03 is a modest default;
  # real underwriting cycles are larger and persist across years.
  adequacy_volatility: 0.03
  base_frequency: 0.12
  severity:
    third_party_weight: 0.20
    own_damage_median_fraction: 0.12
    own_damage_sigma: 1.0
    third_party_scale: 4000
    third_party_alpha: 2.2
  nil_probability: 0.08
  reopen_probability: 0.04
  reopen_estimate_factor: 0.45
  inflation_mean: 1.04
claims:
  base_frequency: 0.12
  report_lag_median: 2
  report_lag_sigma: 1.2
  severity:
    third_party_weight: 0.20
    own_damage_median_fraction: 0.12
    own_damage_sigma: 1.0
    third_party_scale: 4000
    third_party_alpha: 2.2
  # Report-to-close lag. The base shape/mean_days (with the size stretch)
  # govern own-damage claims, which settle in weeks; these are judgement
  # values, since no 10-year physical damage reference exists to score them
  # against. third_party_shape and third_party_mean_days give third-party
  # (liability) claims their own regime, calibrated to the Schedule P
  # reference: a shape below 1 settles many claims quickly while keeping a
  # long tail, so paid development continues into later ages. Re-run the
  # realism gate after any change to third-party paid development.
  close_lag:
    shape: 1.2
    mean_days: 40
    # Own-damage claims costing more than size_threshold in start-year
    # dollars (deflated by the claims inflation index) settle
    # size_multiplier times slower on average.
    size_threshold: 20000
    size_multiplier: 3
    risk_loading: 0.3
    third_party_shape: 0.8
    third_party_mean_days: 425
  # Claims inflation applied by occurrence date to every claim's ground-up
  # loss. Stochastic: each year's factor is `mean` times lognormal noise of
  # sigma `volatility`, compounded from 1.0 in the start year. The index sits
  # at each year's compounded value mid-year and moves smoothly between them.
  inflation:
    mean: 1.04
    volatility: 0.015
  # Probability a reported claim closes without payment. 0 switches nil
  # claims off.
  nil_probability: 0.08
  # Recoveries: money coming back on own-damage claims after they close.
  # Salvage sells the insured vehicle's wreck; subrogation recovers the
  # payout from an at-fault third party. Each recovery is a Beta-distributed
  # share of the claim's gross paid, received a lognormal lag after close.
  # probability 0 switches a recovery type off, and the other fields of that
  # type may then be left out.
  recoveries:
    salvage:
      probability: 0.10
      mean_share: 0.15
      concentration: 10
      lag_median_days: 21
      lag_sigma: 0.5
    subrogation:
      probability: 0.20
      mean_share: 0.80
      concentration: 10
      lag_median_days: 180
      lag_sigma: 0.7
  # Reopening: a closed claim can reopen once - the case is re-raised a
  # lognormal lag after the first close, a second episode develops and pays
  # an additional amount (`estimate_factor` times the claim's ultimate, with
  # lognormal noise, capped for own damage at the cover left), then the claim
  # closes for good. claims.csv shows the final close date. probability 0 switches
  # reopening off, and the other fields may then be left out.
  reopening:
    probability: 0.04
    estimate_factor: 0.45
    estimate_sigma: 0.5
    lag_median_days: 90
    lag_sigma: 0.7
# Case runoff. The claim's true cost is fixed in the claims stage; the case
# adequacy knobs only set the case estimate it opens at (ultimate over the
# expected opening case, and the noise on each estimate), so they move
# reserves and incurred development, never the loss cost.
runoff:
  case_adequacy_mean: 1.0
  case_adequacy_sigma: 0.35
  payments_per_year: 2.5
  settlement_share: 0.4
  concentration: 1.0
  revisions_per_year: 4
  revision_sigma: 0.3
