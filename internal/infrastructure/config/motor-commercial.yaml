# Commercial motor (commercial auto) insurance preset: a book of fleets.
# The preset is calibrated against Schedule P Part 1C, commercial auto/truck
# liability (data/reference/schedule p/comauto_pos_98-07.csv, the 42
# companies application.CommercialAutoCriteria selects). The preset registry
# (internal/infrastructure/config) scores the two third-party sections,
# property damage and injury, together against it: their claims against their
# share of premium. Part 1C has no physical damage in it, so own damage is
# not scored. Commercial auto settles more slowly than personal auto: Part 1C
# pays about 32% of its age-10 paid in the first year, against about 44% for
# Part 1B, and its case incurred develops upward, by a median factor of about
# 1.26 from age 1 to 2.
name: motor-commercial
book:
  # Fleets written each year grow 2% a year, with a little more noise than a
  # personal book, since a few large fleets move it.
  growth_factor: 1.02
  size_volatility: 0.08
  # Within a fleet, the sigma of a vehicle's sum insured around the fleet's
  # median and the standard deviation of its risk factor around the fleet's.
  spread: 0.35
  # The median vehicle's sum insured in the first year: a mix of cars, vans
  # and light trucks.
  sum_insured_median: 35000
  sum_insured_inflation: 1.03
  # Commercial physical damage deductibles, higher than personal motor's. A
  # fleet has one, shared by its vehicles.
  excess_choices:
    - {value: 250, weight: 0.10}
    - {value: 500, weight: 0.30}
    - {value: 1000, weight: 0.35}
    - {value: 2500, weight: 0.20}
    - {value: 5000, weight: 0.05}
  # Fleets: written first, each with one cover start and excess, then each
  # vehicle on a fleet is a policy. size is the lognormal number of vehicles,
  # rounded and at least 1: median 2 and sigma 1.1 make about 40% of fleets a
  # single vehicle, a mean of about 3.8, and the largest of a 100,000-fleet
  # book a few hundred vehicles. sum_insured_sigma sets how far fleets'
  # vehicle values differ (a courier's vans against a haulier's tractors), and
  # risk_spread how far operators differ in drivers, routes and safety; every
  # vehicle on a fleet carries its fleet's risk factor.
  fleet:
    size: {median: 2, sigma: 1.1}
    sum_insured_sigma: 0.5
    risk_spread: 0.4
# Pricing basis: the insurer's assumed loss cost, used only to set premium.
# The assumptions start from the claims values below, so the loss ratio lands
# around target_loss_ratio, moved by claim sampling and the simulated
# inflation path. Each vehicle is priced on its own sum insured and risk
# factor and the fleet's excess.
pricing:
  # About the Part 1C pool's median loss ratio of 0.55. Across seeds 1-30
  # the scored sections' loss ratio lands at 0.52-0.61, inside the pool's
  # P5-P95 band of 0.33-0.68.
  target_loss_ratio: 0.56
  adequacy_volatility: 0.03
  sections:
    - name: own_damage
      base_frequency: 0.09
      severity: {kind: sum_insured_lognormal, median_fraction: 0.08, sigma: 1.0}
    - name: third_party_property
      base_frequency: 0.040
      severity: {kind: lognormal, median: 2500, sigma: 1.0}
      limit: 1000000
      no_excess: true
    - name: third_party_injury
      base_frequency: 0.012
      severity: {kind: pareto, scale: 9000, alpha: 1.8}
      limit: 1000000
      no_excess: true
  nil_probability: 0.08
  reopen_probability: 0.05
  reopen_estimate_factor: 0.45
  inflation_mean: 1.05
claims:
  # Sections of cover, per vehicle-year. See motor-personal.yaml for how a
  # section draws its claims, severity kinds, report and close lags and
  # limits. no_excess: true makes a section take no excess, so every
  # ground-up loss is reported and paid from the first dollar.
  sections:
    # Own damage (physical damage: collision and comprehensive), sized off
    # the vehicle's sum insured: a typical repair is about $2,800 on the
    # median $35,000 vehicle. Reported within days and settled in weeks. Its
    # frequency, severity and lags are judgement values, since no 10-year
    # physical damage reference exists to score them against.
    - name: own_damage
      base_frequency: 0.09
      severity: {kind: sum_insured_lognormal, median_fraction: 0.08, sigma: 1.0}
      report_lag: {median: 2, sigma: 1.2}
      close_lag:
        shape: 1.2
        mean_days: 45
        size_reference: 3000
        size_elasticity: 0.2
        risk_loading: 0.3
      recoveries: true
    # Third-party property damage: the other party's vehicle and property,
    # larger than personal motor's because the insured vehicles are larger,
    # and settled in months. Liability takes no excess: the fleet's
    # deductible is a physical damage term. limit 1000000 is the common $1m
    # combined single limit, which a property damage claim rarely reaches.
    - name: third_party_property
      base_frequency: 0.040
      severity: {kind: lognormal, median: 2500, sigma: 1.0}
      limit: 1000000
      no_excess: true
      report_lag: {median: 4, sigma: 1.3}
      close_lag:
        shape: 1.2
        mean_days: 90
        size_reference: 2500
        size_elasticity: 0.2
        risk_loading: 0.3
    # Third-party bodily injury: rarer, heavier-tailed than personal motor's
    # (alpha 1.8), reported later and settled slowly. limit 1000000 is the
    # $1m combined single limit. With property damage's frequency and
    # severity it carries about 60% of the liability cost.
    # Its lags carry Part 1C's development and were set by calibration
    # against the 42-company pool. close_lag mean_days 950 with shape 4.0, a
    # tight gamma, keeps the paid pattern near the pool's median through age
    # 5 without the long tail that put paid development at ages 8-10 above
    # its band; report_lag sigma 1.3 and size_elasticity 0.1 trim the tail
    # for the same reason. Every seed of 1-30 passes the realism gate.
    # Re-run it after any change to either third-party section.
    - name: third_party_injury
      base_frequency: 0.012
      severity: {kind: pareto, scale: 9000, alpha: 1.8}
      limit: 1000000
      no_excess: true
      report_lag: {median: 40, sigma: 1.3}
      close_lag:
        shape: 4.0
        mean_days: 950
        size_reference: 15000
        size_elasticity: 0.1
        risk_loading: 0.3
  # A little above personal motor's 4% a year; a judgement value.
  inflation:
    mean: 1.05
    volatility: 0.02
  nil_probability: 0.08
  recoveries:
    salvage:
      probability: 0.90
      mean_share: 0.20
      concentration: 10
      lag_median_days: 21
      lag_sigma: 0.5
    subrogation:
      probability: 0.20
      mean_share: 0.80
      concentration: 10
      lag_median_days: 180
      lag_sigma: 0.7
  # Reopening a little more often and later than personal motor; judgement
  # values.
  reopening:
    probability: 0.05
    estimate_factor: 0.45
    estimate_sigma: 0.5
    lag_median_days: 120
    lag_sigma: 0.7
# Case runoff. case_adequacy_mean above 1 opens cases deficient, so incurred
# develops upward as cases strengthen toward the true cost, the shape Part
# 1C's case incurred shows. 1.5 opens cases about a third below their true
# cost, which gives case incurred factors of about 1.27, 1.06 and 1.02 at
# ages 1-3, against Part 1C medians of 1.26, 1.08 and 1.05. The other runoff
# values are judgement: fewer, larger interim payments than personal motor.
runoff:
  case_adequacy_mean: 1.5
  case_adequacy_sigma: 0.4
  payments_per_year: 2.0
  settlement_share: 0.5
  concentration: 1.0
  revisions_per_year: 4
  revision_sigma: 0.3
